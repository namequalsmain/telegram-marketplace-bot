[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # function-call-in-default — common in aiogram filters
    "SIM105", # try/except/pass — explicit is fine, contextlib.suppress is noise
    "SIM108", # ternary — not always more readable
    "B904",   # raise ... from err — overkill for handler error paths
]

[tool.ruff.lint.isort]
known-first-party = ["bot", "database", "config"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
