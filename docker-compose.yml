services:
  db:
    image: postgres:16-alpine
    container_name: market-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-market_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Uncomment to expose Postgres to host for local inspection:
    # ports:
    #   - "5432:5432"

  bot:
    build: .
    container_name: market-bot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
      DB_HOST: db                  # service name inside the compose network
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-market_db}
      MAIN_ADMIN_ID: ${MAIN_ADMIN_ID}

volumes:
  pgdata:
